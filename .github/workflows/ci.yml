
name: C Continuous Integration

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

	strategy:
		fail-fast: false
		matrix:
        	compiler: [gcc, clang]	

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile
        run: make

      - name: Run tests
        run: make test

