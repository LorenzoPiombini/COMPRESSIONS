name: C Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        distro: ['ubuntu:26.04', 'fedora:44']

    container:
      image: ${{ matrix.distro }}

    steps:
      - name: Install Ubuntu dependencies
        if: startsWith(matrix.distro, 'ubuntu')
        run: |
          apt-get update
          apt-get install -y build-essential git

      - name: Install Fedora dependencies
        if: startsWith(matrix.distro, 'fedora')
        run: |
          dnf install -y gcc make git binutils

      - uses: actions/checkout@v6

      - name: Compile
        run: make
